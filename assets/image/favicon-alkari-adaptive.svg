<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256">
<style>
.bg{fill:#000} .logo{filter:none}
@media (prefers-color-scheme: light) { .adaptive{filter:invert(1)} }
</style>
<g class="adaptive">
<rect class="bg" width="256" height="256" rx="0"/>
<image class="logo" x="0" y="0" width="256" height="256" href="data:image/png;base64," preserveAspectRatio="xMidYMid meet"/>
</g>
</svg>